<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CV Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <a href="index.html" class="nav-logo">CV Plus</a>
        <div class="nav-links">
            <a href="index.html">Directory</a>
            <span id="auth-nav">
                <a href="login.html">Login</a>
                <a href="signup.html" class="view-profile-btn active"
                    style="padding: 0.5rem 1rem; font-size: 0.9rem;">Join Now</a>
            </span>
        </div>
    </nav>

    <main>
        <div class="auth-container">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the professional directory today.</p>

            <form id="signup-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('full-name').value;
            const email = document.getElementById('email').value;
            localStorage.setItem('user_name', name);
            localStorage.setItem('user_email', email);
            localStorage.setItem('is_logged_in', 'true');
            alert('Account created! Let\'s set up your profile.');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>

</html>
