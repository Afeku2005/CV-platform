<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <a href="index.html" class="nav-logo">ProHub</a>
        <div class="nav-links">
            <a href="index.html">Directory</a>
            <a href="love.html">Special Effect</a>
            <span id="auth-nav">
                <a href="login.html" class="active">Login</a>
                <a href="signup.html" class="view-profile-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Join
                    Now</a>
            </span>
        </div>
    </nav>

    <main>
        <div class="auth-container">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to manage your professional profile.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Local login mock for demonstration
            const email = document.getElementById('email').value;
            localStorage.setItem('user_email', email);
            localStorage.setItem('is_logged_in', 'true');
            alert('Welcome back! Redirecting to dashboard...');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>

</html>
